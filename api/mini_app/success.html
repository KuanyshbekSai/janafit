<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата успешна! — Janafit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center shadow-2xl space-y-6">
    <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto text-4xl shadow-lg">
      ✓
    </div>

    <div class="space-y-2">
      <span class="text-xs uppercase font-bold text-pink-400 tracking-wider">Janafit • Добро пожаловать!</span>
      <h1 class="text-2xl font-black text-white">Оплата прошла успешно!</h1>
      <p class="text-sm text-slate-400 leading-relaxed">
        Ваш доступ к курсу <b>«Janafit: 21 День»</b> активирован. Персональная ссылка уже отправлена вам в Telegram!
      </p>
    </div>

    <div class="p-4 bg-slate-800/60 rounded-2xl border border-slate-700/50 text-xs text-left space-y-1.5">
      <div class="flex justify-between"><span class="text-slate-400">Номер заказа:</span> <span class="font-mono text-slate-200">{{ inv_id }}</span></div>
      <div class="flex justify-between"><span class="text-slate-400">Сумма:</span> <span class="font-bold text-pink-400">{{ out_sum }} ₸</span></div>
      <div class="flex justify-between"><span class="text-slate-400">Статус:</span> <span class="text-emerald-400 font-bold">Оплачено</span></div>
    </div>

    <div class="space-y-3">
      <a href="https://t.me/janafit_bot" class="block w-full py-4 rounded-2xl bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-95 text-white font-bold text-sm shadow-xl shadow-pink-600/30 transition-all">
        🚀 Открыть тренировки в Telegram
      </a>
      <a href="/app" class="block w-full py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition-all">
        Открыть веб-плеер
      </a>
    </div>
  </div>

  <script>
    // Запуск праздничного конфетти
    window.onload = () => {
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 }
      });
    };
  </script>
</body>
</html>
