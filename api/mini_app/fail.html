<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата не завершена — Janafit</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center shadow-2xl space-y-6">
    <div class="w-20 h-20 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-full flex items-center justify-center mx-auto text-4xl shadow-lg">
      ✕
    </div>

    <div class="space-y-2">
      <span class="text-xs uppercase font-bold text-rose-400 tracking-wider">Платёж отменен</span>
      <h1 class="text-2xl font-black text-white">Оплата не завершена</h1>
      <p class="text-sm text-slate-400 leading-relaxed">
        Возможно, на карте недостаточно средств, превышен лимит на интернет-покупки или операция была отменена.
      </p>
    </div>

    <div class="space-y-3">
      <a href="https://t.me/janafit_bot" class="block w-full py-4 rounded-2xl bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-95 text-white font-bold text-sm shadow-xl shadow-pink-600/30 transition-all">
        🔄 Попробовать снова через бота
      </a>
      <a href="https://t.me/janafit_support" class="block w-full py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition-all">
        Написать в поддержку
      </a>
    </div>
  </div>
</body>
</html>
